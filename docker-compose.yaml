services:
  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-u", "src/processor.py"]
    # The Orin's GPU: YOLO runs ~35 ms a frame here against ~2 s on the CPU.
    # The runtime passes in the GPU devices and driver; JetPack 6 leaves the
    # CUDA and cuDNN userspace to the container, so the host's are mounted
    # read-only and docker/jetson-env.sh puts them on the library path. Using
    # the host's keeps them matched to the driver across JetPack updates.
    runtime: nvidia
    volumes:
      - /mnt/jetsondata/tesla-alerts:/data
      - /usr/local/cuda-12.6:/usr/local/cuda:ro
      - /usr/lib/aarch64-linux-gnu:/host-lib:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      # Belt and braces: clipmeta.py parses clip times in CLIP_TIMEZONE
      # regardless, but logs and anything else that asks the OS should agree.
      - TZ=America/Los_Angeles
      - BASE_DIR=/data
      # The processor does NOT read the car's volume. The host-side
      # ingest.service (src/ingest.py, deploy/ingest.service) copies finished
      # clips into /data/inbox, and only while the volume is not being offered
      # to the car over USB - a decision that needs configfs, which this
      # container should never see. This stub stays empty on purpose.
      - TESLACAM_DIR=/data/teslacam_stub/TeslaCam
      - YOLO_CONFIG_DIR=/data/.config
      # Model weights for the ALPR and face stages; ./scripts/fetch_models.sh
      # downloads them into this directory on the host.
      - MODELS_DIR=/data/models
    restart: unless-stopped

  gif_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-u", "src/gif_worker.py"]
    volumes:
      - /mnt/jetsondata/tesla-alerts:/data
    # gif_worker reads GIF_SECONDS / GIF_FPS / GIF_SCALE_WIDTH, so it needs .env
    # like every other service. Without this those knobs are silently inert.
    env_file: .env
    environment:
      - PYTHONPATH=/app
      # Belt and braces: clipmeta.py parses clip times in CLIP_TIMEZONE
      # regardless, but logs and anything else that asks the OS should agree.
      - TZ=America/Los_Angeles
      - BASE_DIR=/data
    restart: unless-stopped

  # Vehicle telemetry: the port of Scout's TeslaJS poll.js. Without Tesla API
  # credentials in .env this exits immediately with an explanation, which is a
  # supported way to run - detections just won't carry GPS context.
  poller:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-u", "src/poller.py"]
    volumes:
      - /mnt/jetsondata/tesla-alerts:/data
    env_file: .env
    environment:
      - PYTHONPATH=/app
      # Belt and braces: clipmeta.py parses clip times in CLIP_TIMEZONE
      # regardless, but logs and anything else that asks the OS should agree.
      - TZ=America/Los_Angeles
      - BASE_DIR=/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "src.ui_app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    # The CUDA libraries but NOT the nvidia runtime: the Settings page imports
    # torch (via PlateReader), and the JetPack wheel will not load without
    # them, but this process should stay on the CPU rather than take a CUDA
    # context's worth of the RAM it shares with the processor.
    volumes:
      - /mnt/jetsondata/tesla-alerts:/data
      - /usr/local/cuda-12.6:/usr/local/cuda:ro
      - /usr/lib/aarch64-linux-gnu:/host-lib:ro
    env_file: .env
    environment:
      - BASE_DIR=/data
      - PYTHONPATH=/app
      # Belt and braces: clipmeta.py parses clip times in CLIP_TIMEZONE
      # regardless, but logs and anything else that asks the OS should agree.
      - TZ=America/Los_Angeles
      - MODELS_DIR=/data/models
      # The Settings page constructs a PlateReader, which loads ultralytics.
      # Without this it writes its config into the container's ephemeral HOME
      # instead of sharing the processor's, and loses it on every recreate.
      - YOLO_CONFIG_DIR=/data/.config
      # The tunnel publishes this dashboard at azula.tedebyte.dev/tesla/ (that
      # hostname's '/' belongs to the spv-server). Links carry the prefix; the
      # app strips it, so http://<jetson>:8080/ without it still works.
      - URL_ROOT=/tesla
    restart: unless-stopped
